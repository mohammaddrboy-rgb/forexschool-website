# Deploys the static site to the web server whenever main changes.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions → New repository secret):
#   SSH_HOST     server IP or hostname
#   SSH_USER     SSH login user
#   SSH_KEY      private key whose public half is in ~/.ssh/authorized_keys on the server
#   DEPLOY_PATH  folder the site is served from, e.g. /var/www/html
#
# The server needs rsync installed. Files on the server that aren't in the repo are left alone.
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz \
            --exclude '.git/' --exclude '.github/' --exclude '__pycache__/' \
            --exclude '*.py' --exclude 'README.md' --exclude '.gitignore' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
